<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parl Office Assistant</title>

  <!-- PWA SETTINGS -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#003366">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      color: #003366;
    }

    #chat {
      margin-top: 20px;
      background: white;
      padding: 10px;
      border-radius: 8px;
      min-height: 200px;
    }

    input {
      padding: 10px;
      width: 70%;
    }

    button {
      padding: 10px;
      cursor: pointer;
      background: #003366;
      color: white;
      border: none;
    }

    p {
      margin: 5px 0;
    }
  </style>
</head>

<body>

  <h1>Parl Office Assistant</h1>
  <p>Ask me anything about office tasks.</p>

  <input id="msg" placeholder="Type your message..." />
  <button onclick="send()">Send</button>

  <div id="chat"></div>

  <script>
    function send() {
      const msg = document.getElementById("msg").value;
      const chat = document.getElementById("chat");

      if (!msg) return;

      chat.innerHTML += "<p><b>You:</b> " + msg + "</p>";

      let reply = "I can help with memos, meetings, and office tasks.";

      if (msg.toLowerCase().includes("memo")) {
        reply = "Memo format: To, From, Subject, Body, Signature.";
      } else if (msg.toLowerCase().includes("meeting")) {
        reply = "Meeting notes: Date, Agenda, Attendees, Decisions.";
      } else if (msg.toLowerCase().includes("leave")) {
        reply = "Leave form: Name, Dates, Reason, Approval.";
      }

      chat.innerHTML += "<p><b>Assistant:</b> " + reply + "</p>";

      document.getElementById("msg").value = "";
    }

    // Register service worker for PWA
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js");
    }
  </script>

</body>
</html>
